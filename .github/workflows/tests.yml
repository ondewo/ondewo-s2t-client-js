name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # `make build` regenerates the ROOT package.json from src/package.json, and
      # `make restore_ci_test_setup` merges .ci-package.json back over it. This step fails loudly if the
      # two ever disagree on a script or dependency .ci-package.json declares, i.e. if the restore has
      # silently gone stale.
      - name: package.json <-> .ci-package.json mirror
        run: npm run test:drift

      # ONE gate for the whole hand-written surface. The repo is ~95% generated gRPC/protobuf stubs, so
      # coverage is scoped to auth/ (the D18 Keycloak offline-token provider) and examples/ (the mock-based
      # gRPC-web example -- the client and the login are stubbed, no live backend). Every spec runs in a
      # single c8 process at a 100% statement/branch/function/line threshold, `--per-file` so no file can be
      # averaged away, and `--all` so a new hand-written file under auth/ or examples/ that no test requires
      # cannot sit at 0% unnoticed. Generated stubs (api/), the submodules and *.spec.js are out of scope.
      - name: All tests + 100% coverage gate on the hand-written code
        run: npm test
